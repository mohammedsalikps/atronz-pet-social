<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FAF8F4" />
    <meta
      name="description"
      content="Atronz Pet Social — the community app for pet owners: share, discover, adopt, and find trusted pet services."
    />
    <title>Atronz — Pet Social</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      /*
       * Pre-JS splash. Inlined so the Android WebView paints the app's own
       * background and mark immediately instead of a white flash while the
       * bundle parses. React replaces #root's contents on mount.
       */
      html,
      body {
        margin: 0;
        background: #faf8f4;
      }
      #app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #app-boot img {
        width: 168px;
        height: auto;
      }
      #app-boot .label {
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6f706b;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot">
        <img src="./brand-lockup.png" alt="Atronz Innovations" />
        <p class="label">Pet Social</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
